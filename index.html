<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUJOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HUJOS</h1>
        <p>Escoge tus productos y haz tu pedido directamente por WhatsApp</p>
        <button onclick="solicitarAccesoAdmin()" id="btn-admin-toggle">⚙️ Panel Administrador</button>
    </header>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <section id="panel-admin" class="admin-panel" style="display: none;">
        <h2>🛠️ Panel de Control (Administrar Productos)</h2>
        <form id="form-producto" onsubmit="guardarProducto(event)">
            <input type="hidden" id="admin-id">
            <input type="text" id="admin-nombre" placeholder="Nombre del producto" required>
            <input type="number" step="0.01" id="admin-precio" placeholder="Precio (S/)" required>
            <input type="number" id="admin-stock" placeholder="Stock disponible" required>
            
            <div class="input-grupo-file">
                <label for="admin-imagen">Foto del producto (Cámara o Galería):</label>
                <input type="file" id="admin-imagen" accept="image/*">
            </div>

            <button type="submit" id="btn-guardar-prod">Agregar Producto</button>
            <button type="button" onclick="limpiarFormulario()" style="background: #6c757d;">Cancelar</button>
        </form>

        <h3>Inventario Actual</h3>
        <div id="lista-admin-productos"></div>
    </section>

    <main class="contenedor-principal">
        <!-- Catálogo de productos -->
        <section id="contenedor-productos" class="grid-productos"></section>

        <!-- Carrito de compras -->
        <aside class="carrito-box">
            <h2>Tu Pedido</h2>
            <ul id="lista-carrito">
                <p>El carrito está vacío</p>
            </ul>
            <h3>Total: S/<span id="total-pagar">0.00</span></h3>
            <button onclick="enviarWhatsApp()" id="btn-whatsapp" disabled>Enviar pedido por WhatsApp</button>
        </aside>
    </main>

    <script src="javascript.js"></script>
    <script src="app.js"></script>
</body>
</html>
